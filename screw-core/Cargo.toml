[package]
name = "screw-core"
edition = "2024"

[dependencies]
screw-components = { path = "../screw-components" }
hyper = { version = "1.8.1", features = ["server", "http1", "http2"] }
http-body-util = "0.1.0"
bytes = "1.11.0"
actix-router = "0.5.1"
form_urlencoded = "1.2.1"

[dev-dependencies]
tokio = { version = "1.27.0", features = ["rt", "rt-multi-thread", "macros", "net"] }
hyper = { version = "1.8.1", features = ["client"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }